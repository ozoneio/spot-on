name: Run spot-on

# Shared job for every manual workflow; each caller declares only the inputs its operation needs.
on:
  workflow_call:
    inputs:
      command:
        type: string
        required: true
      playlist_id:
        type: string
        required: false
      sort_by:
        type: string
        required: false
      sort_order:
        type: string
        required: false
      other_playlist_id:
        type: string
        required: false
      source_playlist_ids:
        type: string
        required: false
      config_file:
        type: string
        required: false
      run_id:
        type: string
        required: false
      run_attempt:
        type: string
        required: false
      backup_file:
        type: string
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --no-dev
      - name: Download backup artifact
        if: inputs.command == 'restore'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spot-on-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Run ${{ inputs.command }}
        id: operation
        env:
          COMMAND: ${{ inputs.command }}
          SORT_BY: ${{ inputs.sort_by }}
          SORT_ORDER: ${{ inputs.sort_order }}
          OTHER_PLAYLIST_ID: ${{ inputs.other_playlist_id }}
          SOURCE_PLAYLIST_IDS: ${{ inputs.source_playlist_ids }}
          CONFIG_FILE: ${{ inputs.config_file || vars.SPOTIFY_BATCH_CONFIG || 'batch.json' }}
          BACKUP_FILE: ${{ inputs.backup_file }}
          SPOTIFY_PLAYLIST_ID: ${{ inputs.playlist_id || vars.SPOTIFY_PLAYLIST_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          if [[ "$COMMAND" == "batch" ]]; then
            uv run --locked --no-dev spot-on batch --config "$CONFIG_FILE" --backup-dir backups --report-dir reports
            exit 0
          fi
          if [[ ! "$SPOTIFY_PLAYLIST_ID" =~ ^[A-Za-z0-9]{22}$ ]]; then
            echo "SPOTIFY_PLAYLIST_ID must be a 22-character Spotify playlist ID containing only letters and numbers." >&2
            exit 1
          fi
          case "$COMMAND" in
            duplicates)
              uv run --locked --no-dev spot-on duplicates --playlist-id "$SPOTIFY_PLAYLIST_ID" | tee reports/duplicates.json
              ;;
            backup)
              uv run --locked --no-dev spot-on backup --playlist-id "$SPOTIFY_PLAYLIST_ID" --backup-dir backups | tee reports/backup.json
              ;;
            sort)
              sort_args=(sort --playlist-id "$SPOTIFY_PLAYLIST_ID" --by "$SORT_BY" --backup-dir backups)
              if [[ "$SORT_ORDER" != "default" && -n "$SORT_ORDER" ]]; then
                sort_args+=(--order "$SORT_ORDER")
              fi
              uv run --locked --no-dev spot-on "${sort_args[@]}" | tee reports/sort.json
              ;;
            compare)
              if [[ ! "$OTHER_PLAYLIST_ID" =~ ^[A-Za-z0-9]{22}$ ]]; then
                echo "other_playlist_id is required by compare and must be a 22-character Spotify playlist ID containing only letters and numbers." >&2
                exit 1
              fi
              uv run --locked --no-dev spot-on compare --playlist-id "$SPOTIFY_PLAYLIST_ID" --other-playlist-id "$OTHER_PLAYLIST_ID" | tee reports/compare.json
              ;;
            merge)
              source_ids=()
              while read -r -a line_ids; do
                source_ids+=("${line_ids[@]}")
              done <<< "$SOURCE_PLAYLIST_IDS"
              if [[ "${#source_ids[@]}" -eq 0 ]]; then
                echo "source_playlist_ids must contain at least one source playlist ID for merge." >&2
                exit 1
              fi
              merge_args=(merge --playlist-id "$SPOTIFY_PLAYLIST_ID" --backup-dir backups)
              for source_id in "${source_ids[@]}"; do
                if [[ ! "$source_id" =~ ^[A-Za-z0-9]{22}$ ]]; then
                  echo "Every source_playlist_ids entry must be a 22-character Spotify playlist ID containing only letters and numbers: $source_id" >&2
                  exit 1
                fi
                merge_args+=(--source-playlist-id "$source_id")
              done
              uv run --locked --no-dev spot-on "${merge_args[@]}" | tee reports/merge.json
              ;;
            restore)
              if [[ ! "$BACKUP_FILE" =~ ^[A-Za-z0-9._-]+\.json$ ]]; then
                echo "backup_file must be a JSON filename with letters, numbers, dots, underscores, or hyphens, without directories." >&2
                exit 1
              fi
              uv run --locked --no-dev spot-on restore --playlist-id "$SPOTIFY_PLAYLIST_ID" --backup-file "downloaded/backups/$BACKUP_FILE" --backup-dir backups | tee reports/restore.json
              ;;
            *)
              echo "Unsupported command: $COMMAND" >&2
              exit 1
              ;;
          esac
      - name: Save reports and backups
        if: always() && steps.operation.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spot-on-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backups/
            reports/
          if-no-files-found: error
          retention-days: 30
