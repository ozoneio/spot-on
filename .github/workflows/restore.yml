name: Restore playlist order

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID containing the backup artifact
        type: string
        required: true
      run_attempt:
        description: Attempt number of that workflow run
        type: string
        required: true
        default: "1"
      backup_file:
        description: JSON filename inside the artifact's backups directory
        type: string
        required: true
      playlist_id:
        description: Spotify playlist ID (empty uses the repository variable)
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: spotify-playlist-operations
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --no-dev
      - name: Download backup artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spot-on-${{ inputs.run_id }}-${{ inputs.run_attempt }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Restore playlist order
        id: operation
        env:
          BACKUP_FILE: ${{ inputs.backup_file }}
          SPOTIFY_PLAYLIST_ID: ${{ inputs.playlist_id || vars.SPOTIFY_PLAYLIST_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          if [[ ! "$SPOTIFY_PLAYLIST_ID" =~ ^[A-Za-z0-9]{22}$ ]]; then
            echo "SPOTIFY_PLAYLIST_ID must be a 22-character Spotify playlist ID containing only letters and numbers." >&2
            exit 1
          fi
          if [[ ! "$BACKUP_FILE" =~ ^[A-Za-z0-9._-]+\.json$ ]]; then
            echo "backup_file must be a JSON filename with letters, numbers, dots, underscores, or hyphens, without directories." >&2
            exit 1
          fi
          uv run --locked --no-dev spot-on restore --playlist-id "$SPOTIFY_PLAYLIST_ID" --backup-file "downloaded/backups/$BACKUP_FILE" --backup-dir backups | tee reports/restore.json
      - name: Save restore report and safety backup
        if: always() && steps.operation.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spot-on-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backups/
            reports/
          if-no-files-found: error
          retention-days: 30
