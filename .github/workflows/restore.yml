name: Restore playlist order

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID containing the backup artifact
        type: string
        required: true
      run_attempt:
        description: Attempt number of that workflow run
        type: string
        required: true
        default: "1"
      backup_file:
        description: JSON filename inside the artifact's backups directory
        type: string
        required: true
      playlist_id:
        description: Spotify playlist ID (empty uses the SPOTIFY_PLAYLIST_ID variable)
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: spotify-playlist-operations
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run.yml
    with:
      command: restore
      run_id: ${{ inputs.run_id }}
      run_attempt: ${{ inputs.run_attempt }}
      backup_file: ${{ inputs.backup_file }}
      playlist_id: ${{ inputs.playlist_id }}
    secrets: inherit
