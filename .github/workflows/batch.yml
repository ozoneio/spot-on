name: Batch playlist tools

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: Repository path to batch JSON (empty uses SPOTIFY_BATCH_CONFIG or batch.json)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: spotify-playlist-operations
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/run.yml
    with:
      command: batch
      config_file: ${{ inputs.config_file }}
    secrets: inherit
