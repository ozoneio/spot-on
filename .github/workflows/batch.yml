name: Batch playlist tools

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: Repository path to batch JSON (empty uses SPOTIFY_BATCH_CONFIG or batch.json)
        type: string
        required: false
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: spotify-playlist-operations
  cancel-in-progress: false

jobs:
  batch:
    if: github.event_name == 'workflow_dispatch' || vars.SPOTIFY_ENABLE_BATCH_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --no-dev
      - name: Run batch operations
        id: operation
        env:
          COMMAND: ${{ github.event_name == 'schedule' && 'batch-due' || 'batch' }}
          CONFIG_FILE: ${{ inputs.config_file || vars.SPOTIFY_BATCH_CONFIG || 'batch.json' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          uv run --locked --no-dev spot-on "$COMMAND" --config "$CONFIG_FILE" --backup-dir backups --report-dir reports
      - name: Save batch reports and backups
        if: always() && steps.operation.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spot-on-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backups/
            reports/
          if-no-files-found: error
          retention-days: 30
